<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 300px; background: #1e1e2e; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .header { background: linear-gradient(135deg, #cba6f7, #89b4fa); padding: 20px; text-align: center; }
    .logo { font-size: 24px; font-weight: 800; color: #1e1e2e; }
    .tagline { font-size: 11px; color: #313244; margin-top: 2px; }
    .body { padding: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #6c7086; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    input { width: 100%; background: #313244; border: 1px solid #45475a; border-radius: 8px; padding: 8px 12px; color: #cdd6f4; font-size: 13px; outline: none; }
    input:focus { border-color: #cba6f7; }
    button { width: 100%; background: #cba6f7; color: #1e1e2e; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 12px; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    .shortcut { margin-top: 14px; padding: 10px; background: #313244; border-radius: 8px; font-size: 12px; color: #6c7086; text-align: center; }
    .shortcut kbd { background: #45475a; padding: 1px 6px; border-radius: 4px; color: #cdd6f4; font-size: 11px; }
    .status { margin-top: 8px; font-size: 12px; text-align: center; color: #a6e3a1; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✨ Aura</div>
    <div class="tagline">AI Writing Assistant</div>
  </div>
  <div class="body">
    <label>OpenAI API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
    <button id="save">Save Key</button>
    <p class="status" id="status">✓ Saved!</p>
    <div class="shortcut">Press <kbd>Alt + A</kbd> on any selected text</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
